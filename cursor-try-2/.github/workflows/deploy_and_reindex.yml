name: CI/CD — Deploy and Reindex

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cursor-try-2
    steps:
      - uses: actions/checkout@v4

      - name: Validate Azure deployment secrets (service principal flow)
        run: |
          echo "Checking required secrets..."
          if [ -z "${{ secrets.AZURE_WEBAPP_NAME }}" ]; then echo "ERROR: AZURE_WEBAPP_NAME secret is not set"; exit 1; fi
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then echo "ERROR: AZURE_CREDENTIALS secret is not set (service principal JSON)"; exit 1; fi
          if [ -z "${{ secrets.AZURE_RESOURCE_GROUP }}" ]; then echo "ERROR: AZURE_RESOURCE_GROUP secret is not set (resource group containing the Web App)"; exit 1; fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (if any)
        run: |
          if [ -f pytest.ini ] || [ -d tests ]; then pytest -q || true; else echo "No tests found"; fi

  deploy:
    name: Deploy to Azure Web App
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Login to Azure using service principal'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Debug: show Azure target web app and slots
        run: |
          echo "Azure account:"; az account show
          echo "Show webapp (if fails, list apps containing name):"
          az webapp show --name "${{ secrets.AZURE_WEBAPP_NAME }}" --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" || az webapp list --query "[?contains(name, '${{ secrets.AZURE_WEBAPP_NAME }}')]" -o table
          echo "List deployment slots for the app (if any):"
          az webapp deployment slot list --name "${{ secrets.AZURE_WEBAPP_NAME }}" --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" -o table

      - name: Execute startup command on remote (Kudu)
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
        run: |
          if [ -f cursor-try-2/start_up.txt ]; then
            startup_cmd=$(cat cursor-try-2/start_up.txt)
            echo "Will execute startup command on remote app: $startup_cmd"

            # Obtain publishing credentials (username/password) via Azure CLI
            publish_user=$(az webapp deployment list-publishing-credentials --name "$AZURE_WEBAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query publishingUserName -o tsv)
            publish_pass=$(az webapp deployment list-publishing-credentials --name "$AZURE_WEBAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query publishingPassword -o tsv)

            if [ -z "$publish_user" ] || [ -z "$publish_pass" ]; then
              echo "Failed to obtain publishing credentials. Ensure the service principal has appropriate permissions."; exit 1
            fi

            kudu_url="https://${AZURE_WEBAPP_NAME}.scm.azurewebsites.net/api/command"
            echo "Executing via Kudu: $kudu_url"

            # Execute the command via Kudu API
            curl -fsS -u "$publish_user:$publish_pass" -H "Content-Type: application/json" -d "{\"command\": \"$startup_cmd\"}" "$kudu_url" || true
          else
            echo "No cursor-try-2/start_up.txt found; skipping remote execution."
          fi

      - name: 'Deploy to Azure Web App using service principal'
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: cursor-try-2

