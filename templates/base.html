<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Портал якості{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="top-nav">
        <div class="nav-left">
            <a href="/dashboard" class="nav-logo">Портал якості</a>
            <a href="/dashboard">Панель</a>
            <div class="dropdown">
                <a href="#" class="dropdown-toggle">QA-інструменти</a>
                <div class="dropdown-menu">
                    <a href="/test-cases">Тест-кейси</a>
                    <a href="/bug-reports">Баг-репорти</a>
                </div>
            </div>
            <a href="/ai-helper">Асистент</a>
        </div>
        <div class="nav-right">
            <div class="user-dropdown">
                <span class="user-name" id="current-user">Завантаження...</span>
                <div class="dropdown-menu">
                    <a href="/profile" id="user-profile">Профіль</a>
                    <a href="#" id="logout-btn">Вийти</a>
                </div>
            </div>
        </div>
    </nav>
    
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
