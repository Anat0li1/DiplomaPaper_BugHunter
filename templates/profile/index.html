{% extends "base.html" %}

{% block title %}Профіль - Портал якості{% endblock %}

{% block content %}
<div class="profile-page">
    <h1>Мій профіль</h1>
    
    <div class="card">
        <form id="profile-form">
            <div class="form-group">
                <label>Імʼя користувача *</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" name="email" disabled style="background-color: #f5f5f5;">
                <small style="color: #666;">Email змінити не можна</small>
            </div>
            
            <div class="form-group">
                <label>Активна роль</label>
                <input type="text" id="active_role" name="active_role" disabled style="background-color: #f5f5f5;">
            </div>
            
            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary">Оновити профіль</button>
            </div>
        </form>
    </div>
    
    <div class="card" style="margin-top: 2rem;">
        <h2>Змінити пароль</h2>
        <form id="password-form">
            <div class="form-group">
                <label>Поточний пароль *</label>
                <input type="password" id="old_password" name="old_password" required>
            </div>
            
            <div class="form-group">
                <label>Новий пароль *</label>
                <input type="password" id="new_password" name="new_password" required minlength="6">
            </div>
            
            <div class="form-group">
                <label>Підтвердіть новий пароль *</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
            </div>
            
            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary">Змінити пароль</button>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    loadProfile();
});

function loadProfile() {
    fetch('/api/auth/user', {
        headers: getAuthHeaders()
    })
    .then(res => res.json())
    .then(user => {
        document.getElementById('username').value = user.username || '';
        document.getElementById('email').value = user.email || '';
        document.getElementById('active_role').value = user.active_role || 'user';
    })
    .catch(err => {
        console.error('Помилка завантаження профілю:', err);
        showAlert('Не вдалося завантажити профіль', 'error');
    });
}

document.getElementById('profile-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const data = {
        username: document.getElementById('username').value
    };
    
    try {
        const response = await fetch('/api/auth/update', {
            method: 'PUT',
            headers: getAuthHeaders(),
            body: JSON.stringify(data)
        });
        
        if (response.ok) {
            showAlert('Профіль успішно оновлено', 'success');
        } else {
            const error = await response.json();
            showAlert(error.error || 'Не вдалося оновити профіль', 'error');
        }
    } catch (err) {
        showAlert('Помилка мережі', 'error');
    }
});

document.getElementById('password-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const newPassword = document.getElementById('new_password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    
    if (newPassword !== confirmPassword) {
        showAlert('Нові паролі не збігаються', 'error');
        return;
    }
    
    const data = {
        old_password: document.getElementById('old_password').value,
        password: newPassword
    };
    
    try {
        const response = await fetch('/api/auth/update', {
            method: 'PUT',
            headers: getAuthHeaders(),
            body: JSON.stringify(data)
        });
        
        if (response.ok) {
            showAlert('Пароль успішно змінено', 'success');
            document.getElementById('password-form').reset();
        } else {
            const error = await response.json();
            showAlert(error.error || 'Не вдалося змінити пароль', 'error');
        }
    } catch (err) {
        showAlert('Помилка мережі', 'error');
    }
});
</script>
{% endblock %}
