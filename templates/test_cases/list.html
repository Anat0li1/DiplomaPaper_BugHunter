{% extends "base.html" %}

{% block title %}Тест-кейси - Портал якості{% endblock %}

{% block content %}
<div class="test-cases-list">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h1>Тест-кейси</h1>
        <a href="/test-cases/new" class="btn btn-primary">Створити тест-кейс</a>
    </div>
    
    <div class="card">
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Назва</th>
                    <th>Пріоритет</th>
                    <th>Група застосунку</th>
                    <th>Версія</th>
                    <th>Дії</th>
                </tr>
            </thead>
            <tbody id="test-cases-table">
                <tr><td colspan="6">Завантаження...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="{{ url_for('static', filename='js/test_cases.js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    loadTestCases();
});

function loadTestCases() {
    fetch('/api/test-cases', {
        headers: getAuthHeaders()
    })
    .then(res => res.json())
    .then(data => {
        const tbody = document.getElementById('test-cases-table');
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6">Тест-кейсів не знайдено</td></tr>';
            return;
        }
        
        tbody.innerHTML = data.map(tc => `
            <tr>
                <td>${tc.given_id}</td>
                <td>${tc.title}</td>
                <td>${['', 'Високий', 'Середній', 'Низький'][tc.priority] || 'Середній'}</td>
                <td>${tc.application_group || '-'}</td>
                <td>${tc.version || '-'}</td>
                <td>
                    <a href="/test-cases/view/${tc.id}" class="btn btn-secondary" style="padding: 0.25rem 0.75rem; font-size: 0.875rem;">Переглянути</a>
                    <a href="/test-cases/edit/${tc.id}" class="btn btn-primary" style="padding: 0.25rem 0.75rem; font-size: 0.875rem;">Редагувати</a>
                    <button onclick="deleteTestCase('${tc.id}')" class="btn btn-danger" style="padding: 0.25rem 0.75rem; font-size: 0.875rem;">Видалити</button>
                </td>
            </tr>
        `).join('');
    })
    .catch(err => {
        console.error('Помилка завантаження тест-кейсів:', err);
        showAlert('Не вдалося завантажити тест-кейси', 'error');
    });
}

function deleteTestCase(id) {
    if (!confirm('Видалити цей тест-кейс?')) return;
    
    fetch(`/api/test-cases/${id}`, {
        method: 'DELETE',
        headers: getAuthHeaders()
    })
    .then(res => {
        if (res.ok) {
            showAlert('Тест-кейс видалено', 'success');
            loadTestCases();
        } else {
            showAlert('Не вдалося видалити тест-кейс', 'error');
        }
    });
}
</script>
{% endblock %}
