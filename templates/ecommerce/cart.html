{% extends "base.html" %}

{% block title %}Кошик - Портал якості{% endblock %}

{% block content %}
<div class="cart">
    <h1>Кошик</h1>
    
    <div class="card" id="cart-items">
        <p>Завантаження...</p>
    </div>
    
    <div class="card" id="cart-summary" style="margin-top: 2rem; display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Разом: $<span id="cart-total">0.00</span></h2>
            <button class="btn btn-success" onclick="checkout()">Оформити замовлення</button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    loadCart();
});

function loadCart() {
    fetch('/api/cart', {
        headers: getAuthHeaders()
    })
    .then(res => res.json())
    .then(items => {
        const container = document.getElementById('cart-items');
        if (items.length === 0) {
            container.innerHTML = '<p>Кошик порожній</p>';
            document.getElementById('cart-summary').style.display = 'none';
            return;
        }
        
        let total = 0;
        container.innerHTML = `
            <table class="table">
                <thead>
                    <tr>
                        <th>Товар</th>
                        <th>Ціна</th>
                        <th>Кількість</th>
                        <th>Проміжний підсумок</th>
                        <th>Дії</th>
                    </tr>
                </thead>
                <tbody>
                    ${items.map(item => {
                        const subtotal = parseFloat(item.product_price) * item.quantity;
                        total += subtotal;
                        return `
                            <tr>
                                <td>${item.product_name}</td>
                                <td>$${item.product_price}</td>
                                <td>
                                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                                        <button class="btn btn-secondary" style="padding: 0.25rem 0.5rem;" onclick="updateQuantity('${item.id}', ${item.quantity - 1})">-</button>
                                        <input type="number" value="${item.quantity}" min="1" id="qty-${item.id}" style="width: 60px; text-align: center;" onchange="updateQuantity('${item.id}', this.value)">
                                        <button class="btn btn-secondary" style="padding: 0.25rem 0.5rem;" onclick="updateQuantity('${item.id}', ${item.quantity + 1})">+</button>
                                    </div>
                                </td>
                                <td>$${subtotal.toFixed(2)}</td>
                                <td>
                                    <button class="btn btn-danger" style="padding: 0.25rem 0.75rem; font-size: 0.875rem;" onclick="removeItem('${item.id}')">Видалити</button>
                                </td>
                            </tr>
                        `;
                    }).join('')}
                </tbody>
            </table>
        `;
        
        document.getElementById('cart-total').textContent = total.toFixed(2);
        document.getElementById('cart-summary').style.display = 'block';
    });
}

function updateQuantity(itemId, newQuantity) {
    if (newQuantity < 1) {
        removeItem(itemId);
        return;
    }
    
    fetch(`/api/cart/${itemId}`, {
        method: 'PUT',
        headers: getAuthHeaders(),
        body: JSON.stringify({ quantity: parseInt(newQuantity) })
    })
    .then(res => {
        if (res.ok) {
            loadCart();
        }
    });
}

function removeItem(itemId) {
    fetch(`/api/cart/${itemId}`, {
        method: 'DELETE',
        headers: getAuthHeaders()
    })
    .then(res => {
        if (res.ok) {
            loadCart();
        }
    });
}

function checkout() {
    fetch('/api/checkout', {
        method: 'POST',
        headers: getAuthHeaders()
    })
    .then(res => {
        if (res.ok) {
            return res.json();
        } else {
            return res.json().then(err => Promise.reject(err));
        }
    })
    .then(data => {
        showAlert('Замовлення успішно оформлено', 'success');
        setTimeout(() => {
            window.location.href = '/orders';
        }, 1000);
    })
    .catch(err => {
        showAlert(err.error || 'Не вдалося оформити замовлення', 'error');
    });
}
</script>
{% endblock %}
