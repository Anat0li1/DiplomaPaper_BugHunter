{% extends "base.html" %}

{% block title %}Замовлення - Портал якості{% endblock %}

{% block content %}
<div class="orders">
    <h1>Мої замовлення</h1>
    
    <div class="card" id="orders-list">
        <p>Завантаження...</p>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    loadOrders();
});

function loadOrders() {
    fetch('/api/orders', {
        headers: getAuthHeaders()
    })
    .then(res => res.json())
    .then(orders => {
        const container = document.getElementById('orders-list');
        if (orders.length === 0) {
            container.innerHTML = '<p>Замовлень не знайдено</p>';
            return;
        }
        
        container.innerHTML = orders.map(order => `
            <div style="border-bottom: 1px solid #eee; padding: 1.5rem 0;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                    <h3>Замовлення #${order.id.substring(0, 8)}</h3>
                    <p><strong>Разом: $${order.total_amount}</strong></p>
                    <p>${new Date(order.created_at).toLocaleString()}</p>
                </div>
                <ul>
                    ${order.items.map(item => `
                        <li>${item.name} - $${item.price} x ${item.quantity}</li>
                    `).join('')}
                </ul>
            </div>
        `).join('');
    });
}
</script>
{% endblock %}
