name: CI/CD — Deploy and Reindex

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cursor-try-2
    steps:
      - uses: actions/checkout@v4

      - name: Validate Azure deployment secrets (service principal flow)
        run: |
          echo "Checking required secrets..."
          if [ -z "${{ secrets.AZURE_WEBAPP_NAME }}" ]; then echo "ERROR: AZURE_WEBAPP_NAME secret is not set"; exit 1; fi
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then echo "ERROR: AZURE_CREDENTIALS secret is not set (service principal JSON)"; exit 1; fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (if any)
        run: |
          if [ -f pytest.ini ] || [ -d tests ]; then pytest -q || true; else echo "No tests found"; fi

  deploy:
    name: Deploy to Azure Web App
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Login to Azure using service principal'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 'Deploy to Azure Web App using service principal'
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: cursor-try-2

  reindex:
    name: Reindex PDFs (RAG)
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: cursor-try-2
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reindex PDFs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}
          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}
          AZURE_SEARCH_INDEX: ${{ secrets.AZURE_SEARCH_INDEX }}
        run: |
          # run the check script (non-fatal)
          python scripts/check_openai_client.py || true

          # Run indexer against repository data/pdfs folder
          python scripts/ai_indexer.py --index-folder data/pdfs
