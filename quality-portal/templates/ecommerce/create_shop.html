{% extends "base.html" %}

{% block title %}Create Shop - BugHunter{% endblock %}

{% block content %}
<div class="create-shop">
    <h1>Create Your Shop</h1>
    
    <div class="card">
        <form id="create-shop-form">
            <div class="form-group">
                <label>Shop Name *</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label>Description</label>
                <textarea id="description" name="description" rows="4"></textarea>
            </div>
            
            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary">Create Shop</button>
                <a href="/dashboard" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
document.getElementById('create-shop-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const data = {
        name: document.getElementById('name').value,
        description: document.getElementById('description').value
    };
    
    try {
        const response = await fetch('/api/shop', {
            method: 'POST',
            headers: getAuthHeaders(),
            body: JSON.stringify(data)
        });
        
        if (response.ok) {
            window.location.href = '/storefront';
        } else {
            const error = await response.json();
            showAlert(error.error || 'Failed to create shop', 'error');
        }
    } catch (err) {
        showAlert('Network error', 'error');
    }
});
</script>
{% endblock %}
