{% extends "base.html" %}

{% block title %}Bug Reports - BugHunter{% endblock %}

{% block content %}
<div class="bug-reports-list">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h1>Звіти про помилки</h1>
        <a href="/bug-reports/new" class="btn btn-primary">Створити новий звіт про помилку</a>
    </div>
    
    <div class="card">
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Назва</th>
                    <th>Важливість</th>
                    <th>Пріоритет</th>
                    <th>Статус</th>
                    <th>Дії</th>
                </tr>
            </thead>
            <tbody id="bug-reports-table">
                <tr><td colspan="6">Завантаження...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    loadBugReports();
});

function loadBugReports() {
    fetch('/api/bug-reports', {
        headers: getAuthHeaders()
    })
    .then(res => res.json())
    .then(data => {
        const tbody = document.getElementById('bug-reports-table');
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6">Звітів про помилки не знайдено</td></tr>';
            return;
        }
        
        tbody.innerHTML = data.map(br => `
            <tr>
                <td>${br.given_id}</td>
                <td>${br.title}</td>
                <td>${br.severity}</td>
                <td>${br.priority}</td>
                <td>${br.status}</td>
                <td>
                    <a href="/bug-reports/view/${br.id}" class="btn btn-secondary" style="padding: 0.25rem 0.75rem; font-size: 0.875rem;">View</a>
                    <a href="/bug-reports/edit/${br.id}" class="btn btn-primary" style="padding: 0.25rem 0.75rem; font-size: 0.875rem;">Edit</a>
                    <button onclick="deleteBugReport('${br.id}')" class="btn btn-danger" style="padding: 0.25rem 0.75rem; font-size: 0.875rem;">Delete</button>
                </td>
            </tr>
        `).join('');
    })
    .catch(err => {
        console.error('Error loading bug reports:', err);
        showAlert('Failed to load bug reports', 'error');
    });
}

function deleteBugReport(id) {
    if (!confirm('Are you sure you want to delete this bug report?')) return;
    
    fetch(`/api/bug-reports/${id}`, {
        method: 'DELETE',
        headers: getAuthHeaders()
    })
    .then(res => {
        if (res.ok) {
            showAlert('Bug report deleted', 'success');
            loadBugReports();
        } else {
            showAlert('Failed to delete bug report', 'error');
        }
    });
}
</script>
{% endblock %}
