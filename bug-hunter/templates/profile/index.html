{% extends "base.html" %}

{% block title %}My Profile - BugHunter{% endblock %}

{% block content %}
<div class="profile-page">
    <h1>My Profile</h1>
    
    <div class="card">
        <form id="profile-form">
            <div class="form-group">
                <label>Username *</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" name="email" disabled style="background-color: #f5f5f5;">
                <small style="color: #666;">Email cannot be changed</small>
            </div>
            
            <div class="form-group">
                <label>Active Role</label>
                <input type="text" id="active_role" name="active_role" disabled style="background-color: #f5f5f5;">
            </div>
            
            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary">Update Profile</button>
            </div>
        </form>
    </div>
    
    <div class="card" style="margin-top: 2rem;">
        <h2>Change Password</h2>
        <form id="password-form">
            <div class="form-group">
                <label>Current Password *</label>
                <input type="password" id="old_password" name="old_password" required>
            </div>
            
            <div class="form-group">
                <label>New Password *</label>
                <input type="password" id="new_password" name="new_password" required minlength="6">
            </div>
            
            <div class="form-group">
                <label>Confirm New Password *</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
            </div>
            
            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary">Change Password</button>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    loadProfile();
});

function loadProfile() {
    fetch('/api/auth/user', {
        headers: getAuthHeaders()
    })
    .then(res => res.json())
    .then(user => {
        document.getElementById('username').value = user.username || '';
        document.getElementById('email').value = user.email || '';
        document.getElementById('active_role').value = user.active_role || 'user';
    })
    .catch(err => {
        console.error('Error loading profile:', err);
        showAlert('Failed to load profile', 'error');
    });
}

document.getElementById('profile-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const data = {
        username: document.getElementById('username').value
    };
    
    try {
        const response = await fetch('/api/auth/update', {
            method: 'PUT',
            headers: getAuthHeaders(),
            body: JSON.stringify(data)
        });
        
        if (response.ok) {
            showAlert('Profile updated successfully', 'success');
        } else {
            const error = await response.json();
            showAlert(error.error || 'Failed to update profile', 'error');
        }
    } catch (err) {
        showAlert('Network error', 'error');
    }
});

document.getElementById('password-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const newPassword = document.getElementById('new_password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    
    if (newPassword !== confirmPassword) {
        showAlert('New passwords do not match', 'error');
        return;
    }
    
    const data = {
        old_password: document.getElementById('old_password').value,
        password: newPassword
    };
    
    try {
        const response = await fetch('/api/auth/update', {
            method: 'PUT',
            headers: getAuthHeaders(),
            body: JSON.stringify(data)
        });
        
        if (response.ok) {
            showAlert('Password changed successfully', 'success');
            document.getElementById('password-form').reset();
        } else {
            const error = await response.json();
            showAlert(error.error || 'Failed to change password', 'error');
        }
    } catch (err) {
        showAlert('Network error', 'error');
    }
});
</script>
{% endblock %}
