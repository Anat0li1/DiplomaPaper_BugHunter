{% extends "base.html" %}

{% block title %}Test Cases - BugHunter{% endblock %}

{% block content %}
<div class="test-cases-list">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h1>Test Cases</h1>
        <a href="/test-cases/new" class="btn btn-primary">Create New Test Case</a>
    </div>
    
    <div class="card">
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Priority</th>
                    <th>Application Group</th>
                    <th>Version</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="test-cases-table">
                <tr><td colspan="6">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="{{ url_for('static', filename='js/test_cases.js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    loadTestCases();
});

function loadTestCases() {
    fetch('/api/test-cases', {
        headers: getAuthHeaders()
    })
    .then(res => res.json())
    .then(data => {
        const tbody = document.getElementById('test-cases-table');
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6">No test cases found</td></tr>';
            return;
        }
        
        tbody.innerHTML = data.map(tc => `
            <tr>
                <td>${tc.given_id}</td>
                <td>${tc.title}</td>
                <td>${['', 'High', 'Medium', 'Low'][tc.priority] || 'Medium'}</td>
                <td>${tc.application_group || '-'}</td>
                <td>${tc.version || '-'}</td>
                <td>
                    <a href="/test-cases/view/${tc.id}" class="btn btn-secondary" style="padding: 0.25rem 0.75rem; font-size: 0.875rem;">View</a>
                    <a href="/test-cases/edit/${tc.id}" class="btn btn-primary" style="padding: 0.25rem 0.75rem; font-size: 0.875rem;">Edit</a>
                    <button onclick="deleteTestCase('${tc.id}')" class="btn btn-danger" style="padding: 0.25rem 0.75rem; font-size: 0.875rem;">Delete</button>
                </td>
            </tr>
        `).join('');
    })
    .catch(err => {
        console.error('Error loading test cases:', err);
        showAlert('Failed to load test cases', 'error');
    });
}

function deleteTestCase(id) {
    if (!confirm('Are you sure you want to delete this test case?')) return;
    
    fetch(`/api/test-cases/${id}`, {
        method: 'DELETE',
        headers: getAuthHeaders()
    })
    .then(res => {
        if (res.ok) {
            showAlert('Test case deleted', 'success');
            loadTestCases();
        } else {
            showAlert('Failed to delete test case', 'error');
        }
    });
}
</script>
{% endblock %}
