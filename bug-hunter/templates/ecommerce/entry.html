{% extends "base.html" %}

{% block title %}E-commerce - BugHunter{% endblock %}

{% block content %}
<div class="card">
    <h1>Завантаження вашого магазину...</h1>
    <p id="entry-status">Перевірка, чи у вас уже налаштований магазин.</p>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', async () => {
    try {
        const res = await fetch('/api/shop', { headers: getAuthHeaders() });
        if (res.ok) {
            window.location.href = '/storefront';
            return;
        }
        if (res.status === 404) {
            window.location.href = '/create-shop';
            return;
        }
        document.getElementById('entry-status').textContent = 'Неможливо завантажити інформацію про магазин. Спробуйте ще раз.';
    } catch (error) {
        console.error('Error checking shop:', error);
        document.getElementById('entry-status').textContent = 'Неможливо завантажити інформацію про магазин. Спробуйте ще раз.';
    }
});
</script>
{% endblock %}
