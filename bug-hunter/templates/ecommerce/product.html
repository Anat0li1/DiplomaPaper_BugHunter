{% extends "base.html" %}

{% block title %}Product - BugHunter{% endblock %}

{% block content %}
<div class="product-page">
    <div class="card" id="product-details">
        <p>Loading...</p>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    loadProduct('{{ product_id }}');
});

function loadProduct(id) {
    fetch(`/api/products/${id}`, {
        headers: getAuthHeaders()
    })
    .then(res => res.json())
    .then(product => {
        const container = document.getElementById('product-details');
        container.innerHTML = `
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                <div>
                    ${product.image_url ? `<img src="${product.image_url}" alt="${product.name}" style="width: 100%; border-radius: 8px;">` : '<div style="height: 400px; background: #eee; display: flex; align-items: center; justify-content: center;">Немає зображення</div>'}
                </div>
                <div>
                    <h1>${product.name}</h1>
                    <p style="font-size: 1.5rem; font-weight: bold; color: #27ae60; margin: 1rem 0;">$${product.price}</p>
                    <p style="margin: 1rem 0;">${product.description || ''}</p>
                    <p style="color: #999;">Категорія: ${product.category || 'Без категорії'}</p>
                    <p style="color: #999;">Залишок: ${product.quantity}</p>
                    
                    <div style="margin-top: 2rem;">
                        <label>Кількість:</label>
                        <div style="display: flex; align-items: center; gap: 1rem; margin-top: 0.5rem;">
                            <button class="btn btn-secondary" onclick="changeQuantity(-1)">-</button>
                            <input type="number" id="quantity" value="1" min="1" max="${product.quantity}" style="width: 80px; text-align: center;">
                            <button class="btn btn-secondary" onclick="changeQuantity(1)">+</button>
                        </div>
                        <button class="btn btn-primary" style="margin-top: 1rem; width: 100%;" onclick="addToCart('${product.id}')">Додати до кошика</button>
                    </div>
                </div>
            </div>
        `;
    })
    .catch(err => {
        console.error('Error loading product:', err);
        showAlert('Помилка завантаження товару', 'error');
    });
}

function changeQuantity(delta) {
    const input = document.getElementById('quantity');
    const newValue = parseInt(input.value) + delta;
    const max = parseInt(input.max);
    if (newValue >= 1 && newValue <= max) {
        input.value = newValue;
    }
}

function addToCart(productId) {
    const quantity = parseInt(document.getElementById('quantity').value);
    
    fetch('/api/cart', {
        method: 'POST',
        headers: getAuthHeaders(),
        body: JSON.stringify({ product_id: productId, quantity: quantity })
    })
    .then(res => {
        if (res.ok) {
            showAlert('Додано до кошика', 'success');
        } else {
            showAlert('Помилка додавання до кошика', 'error');
        }
    });
}
</script>
{% endblock %}
