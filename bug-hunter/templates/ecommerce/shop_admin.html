{% extends "base.html" %}

{% block title %}Shop Admin - BugHunter{% endblock %}

{% block content %}
<div class="shop-admin">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h1>Адміністрування магазину</h1>
        <a href="/storefront" class="btn btn-primary">Перейти до вітрини</a>
    </div>
    
    <div class="tabs" style="border-bottom: 2px solid #eee; margin-bottom: 2rem;">
        <button class="tab-btn active" onclick="switchTab('info')">Інформація про магазин</button>
        <button class="tab-btn" onclick="switchTab('products')">Управління товарами</button>
    </div>
    
    <div id="tab-info" class="tab-content">
        <div class="card">
            <h2>Інформація про магазин</h2>
            <form id="shop-info-form">
                <div class="form-group">
                    <label>Назва магазину</label>
                    <input type="text" id="shop-name" required>
                </div>
                <div class="form-group">
                    <label>Опис</label>
                    <textarea id="shop-description" rows="4"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Оновити магазин</button>
            </form>
        </div>
    </div>
    
    <div id="tab-products" class="tab-content" style="display: none;">
        <div style="margin-bottom: 2rem;">
            <button class="btn btn-primary" onclick="showProductModal()">Додати новий товар</button>
        </div>
        
        <div class="card">
            <table class="table">
                <thead>
                    <tr>
                        <th>Назва</th>
                        <th>Категорія</th>
                        <th>Ціна</th>
                        <th>Кількість</th>
                        <th>Дії</th>
                    </tr>
                </thead>
                <tbody id="products-table">
                    <tr><td colspan="5">Завантаження...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Product Modal -->
<div id="product-modal" class="modal">
    <div class="modal-content">
        <h2 id="modal-title">Додати товар</h2>
        <form id="product-form">
            <input type="hidden" id="product-id">
            <div class="form-group">
                <label>Назва *</label>
                <input type="text" id="product-name" required>
            </div>
            <div class="form-group">
                <label>Опис</label>
                <textarea id="product-description" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Ціна *</label>
                <input type="number" id="product-price" step="0.01" min="0" required>
            </div>
            <div class="form-group">
                <label>Кількість *</label>
                <input type="number" id="product-quantity" min="0" required>
            </div>
            <div class="form-group">
                <label>URL зображення</label>
                <input type="url" id="product-image">
            </div>
            <div class="form-group">
                <label>Категорія</label>
                <input type="text" id="product-category" list="category-list">
                <datalist id="category-list"></datalist>
            </div>
            <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                <button type="submit" class="btn btn-primary">Зберегти</button>
                <button type="button" class="btn btn-secondary" onclick="closeProductModal()">Скасувати</button>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const currentUser = await fetchUser();
    if (currentUser && currentUser.active_role === 'user') {
        await fetch('/api/auth/change_role', {
            method: 'POST',
            headers: getAuthHeaders()
        });
    }
    
    loadShopInfo();
    loadProducts();
    loadCategories();
});

function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');
    
    event.target.classList.add('active');
    document.getElementById(`tab-${tab}`).style.display = 'block';
}

function loadShopInfo() {
    fetch('/api/shop', {
        headers: getAuthHeaders()
    })
    .then(res => res.json())
    .then(shop => {
        document.getElementById('shop-name').value = shop.name;
        document.getElementById('shop-description').value = shop.description || '';
    });
}

function loadProducts() {
    fetch('/api/products', {
        headers: getAuthHeaders()
    })
    .then(res => {
        if (!res.ok) {
            throw new Error('Failed to load products');
        }
        return res.json();
    })
    .then(products => {
        const tbody = document.getElementById('products-table');
        if (products.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5">No products found</td></tr>';
            return;
        }
        
        tbody.innerHTML = products.map(p => `
            <tr>
                <td>${p.name}</td>
                <td>${p.category || '-'}</td>
                <td>$${p.price}</td>
                <td>${p.quantity}</td>
                <td>
                    <button class="btn btn-primary" style="padding: 0.25rem 0.75rem; font-size: 0.875rem;" onclick="editProduct('${p.id}')">Edit</button>
                    <button class="btn btn-danger" style="padding: 0.25rem 0.75rem; font-size: 0.875rem;" onclick="deleteProduct('${p.id}')">Delete</button>
                </td>
            </tr>
        `).join('');
    })
    .catch(err => {
        console.error('Error loading products:', err);
        const tbody = document.getElementById('products-table');
        tbody.innerHTML = '<tr><td colspan="5">Error loading products</td></tr>';
    });
}

function loadCategories() {
    fetch('/api/categories', {
        headers: getAuthHeaders()
    })
    .then(res => res.json())
    .then(categories => {
        const datalist = document.getElementById('category-list');
        datalist.innerHTML = categories.map(cat => `<option value="${cat}">`).join('');
    });
}

function showProductModal(productId = null) {
    document.getElementById('product-modal').classList.add('active');
    document.getElementById('product-id').value = productId || '';
    document.getElementById('modal-title').textContent = productId ? 'Edit Product' : 'Add Product';
    
    if (productId) {
        fetch(`/api/products/${productId}`, {
            headers: getAuthHeaders()
        })
        .then(res => res.json())
        .then(product => {
            document.getElementById('product-name').value = product.name;
            document.getElementById('product-description').value = product.description || '';
            document.getElementById('product-price').value = product.price;
            document.getElementById('product-quantity').value = product.quantity;
            document.getElementById('product-image').value = product.image_url || '';
            document.getElementById('product-category').value = product.category || '';
        });
    } else {
        document.getElementById('product-form').reset();
    }
}

function closeProductModal() {
    document.getElementById('product-modal').classList.remove('active');
}

function editProduct(id) {
    showProductModal(id);
}

function deleteProduct(id) {
    if (!confirm('Are you sure you want to delete this product?')) return;
    
    fetch(`/api/products/${id}`, {
        method: 'DELETE',
        headers: getAuthHeaders()
    })
    .then(res => {
        if (res.ok) {
            showAlert('Product deleted', 'success');
            loadProducts();
        } else {
            showAlert('Failed to delete product', 'error');
        }
    });
}

document.getElementById('shop-info-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const data = {
        name: document.getElementById('shop-name').value,
        description: document.getElementById('shop-description').value
    };
    
    try {
        const response = await fetch('/api/shop', {
            method: 'PUT',
            headers: getAuthHeaders(),
            body: JSON.stringify(data)
        });
        
        if (response.ok) {
            showAlert('Shop updated', 'success');
        } else {
            showAlert('Failed to update shop', 'error');
        }
    } catch (err) {
        showAlert('Network error', 'error');
    }
});

document.getElementById('product-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const productId = document.getElementById('product-id').value;
    const data = {
        name: document.getElementById('product-name').value,
        description: document.getElementById('product-description').value,
        price: parseFloat(document.getElementById('product-price').value),
        quantity: parseInt(document.getElementById('product-quantity').value),
        image_url: document.getElementById('product-image').value,
        category: document.getElementById('product-category').value
    };
    
    const url = productId ? `/api/products/${productId}` : '/api/products';
    const method = productId ? 'PUT' : 'POST';
    
    try {
        const response = await fetch(url, {
            method: method,
            headers: getAuthHeaders(),
            body: JSON.stringify(data)
        });
        
        if (response.ok) {
            showAlert('Product saved', 'success');
            closeProductModal();
            loadProducts();
            loadCategories();
        } else {
            const errorData = await response.json().catch(() => ({}));
            showAlert(errorData.error || 'Failed to save product', 'error');
        }
    } catch (err) {
        console.error('Error saving product:', err);
        showAlert('Network error', 'error');
    }
});
</script>

<style>
.tab-btn {
    padding: 1rem 2rem;
    border: none;
    background: none;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    font-size: 1rem;
}

.tab-btn.active {
    border-bottom-color: #3498db;
    color: #3498db;
}
</style>
{% endblock %}
