version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bughunter
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/bughunter
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt-secret-key-change-in-production}
      FLASK_ENV: production
      AZURE_OPENAI_API_KEY: EbSYcjioYD7WEp1r9nsHk24neAFw9olw9eVUWiaG4sRg5ZnEPgycJQQJ99CAACfhMk5XJ3w3AAABACOGwncO
      AZURE_OPENAI_ENDPOINT: https://bughunterassistant.openai.azure.com

      AZURE_SEARCH_API_KEY: BOekYhlZijd9JmS6br4BEXA11kgbtK8j2fdhMcpi8bAzSeCs57XB
      AZURE_SEARCH_ENDPOINT: https://bug-hunter-ai-search.search.windows.net
      AZURE_SEARCH_INDEX_NAME: bug-hunter-index
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: text-embedding-3-small
      AZURE_OPENAI_CHAT_DEPLOYMENT: gpt-4.1-mini
      RAG_MAX_CONTEXT_CHARS: 2000
      RAG_TOP_K: 5 
      RAG_SYSTEM_PROMPT: You are a helpful assistant. Use the provided context to answer the user. If the answer is not in the context, reply concisely and honestly that you do not know.

    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: sh -c "alembic upgrade head && python app.py"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:

